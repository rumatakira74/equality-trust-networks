// Ядро: общие типы для всех сообщений протокола.
// Источник: KNOWLEDGE.md v9.2, разделы 9.1–9.3, 12.1, 13, 17.
// Комментарии на русском; идентификаторы на английском.
//
// Общие соглашения (см. spec/00-overview.md):
//   * хеши — SHA-256, 32 байта;
//   * подписи — ECDSA P-256 (кривая secp256r1), DER-кодировка, над signing_hash;
//   * время — Unix-секунды, UTC (раздел 9.2);
//   * canonical-кодирование: protobuf-поля в порядке номеров, без unknown-полей.

syntax = "proto3";

package tnp.v1;

// ---------------------------------------------------------------------------
// Типы транзакций (раздел 9.3 — закрытый перечень, расширению не подлежит).
// ---------------------------------------------------------------------------
enum TxType {
  TX_UNSPECIFIED = 0;
  // Ядро
  REGISTER = 1;              // регистрация: аттестация + усиленный PoW (7.2, 7.3)
  VOUCH = 2;                 // поручительство (7.4)
  MINT = 3;                  // выпуск (10.1)
  TRANSFER = 4;              // перевод, комиссия, мораторий, отложенный перевод (10.2, 7.6, 8.3)
  MIGRATE = 5;               // миграция на новое устройство (11)
  EVIDENCE = 6;              // доказательство нарушения: эквивокация / двойной выпуск (7.5)
  GUARDIAN_OFFER = 7;        // объявление себя публичным гардианом (11)
  // Модули (раздел 6)
  POOL_CREATE = 8;           // 6.3
  POOL_DONATE = 9;           // 6.3
  POOL_CLOSE = 10;           // 6.3
  POOL_CLAIM = 11;           // 6.3
  REDEEM = 12;               // 6.2
  RECEIPT = 13;              // 6.2
  CONTRIBUTION_CLAIM = 14;   // 6.4
  CONTRIBUTION_CONFIRM = 15; // 6.4
}

// ---------------------------------------------------------------------------
// Статусы кошелька (раздел 7.3).
// ---------------------------------------------------------------------------
enum WalletStatus {
  WALLET_UNSPECIFIED = 0;
  REGISTERED = 1; // после register; получает переводы; выпуск недоступен; transfer под мораторием
  ACTIVE = 2;     // после K поручительств; выпуск и обычные переводы
  EXPIRED = 3;    // 3 года в registered без активации; терминальный для адреса
}

// Метки кошелька — отдельные признаки, не статусы (разделы 7.3, 7.5, 6.5).
message WalletFlags {
  bool flagged = 1;   // постоянная публичная метка доказанной эквивокации (7.5)
  bool synthetic = 2; // синтетический кошелёк песочницы (6.5)
  bool seed = 3;      // член посевного круга из genesis (13)
}

// ---------------------------------------------------------------------------
// PoW (разделы 7.6, 9.3, 17).
// Лёгкий PoW — на каждую транзакцию; усиленный memory-hard (Argon2id-подобный)
// — на register и mint. Параметры и таргеты выбираются на этапах 1.2/2
// (PENDING: вопрос №9 в QUESTIONS.md).
// ---------------------------------------------------------------------------
enum PowAlgorithm {
  POW_UNSPECIFIED = 0;
  POW_LIGHT = 1;    // SHA-256-челлендж на каждую транзакцию
  POW_ARGON2ID = 2; // memory-hard, параметры под средний телефон
}

message PowProof {
  PowAlgorithm algorithm = 1;
  // Решение челленджа. Для POW_LIGHT — nonce, при котором
  //   SHA-256(signing_preimage || nonce) < target_light.
  // Для POW_ARGON2ID — nonce на входе Argon2id вместе с signing_preimage
  // (точная формула — spec/01, раздел 1.4).
  bytes nonce = 2;
}

// ---------------------------------------------------------------------------
// Прочие общие типы
// ---------------------------------------------------------------------------

// Необязательный временной слот (раздел 6.2, redeem).
message TimeSlot {
  uint64 start = 1; // Unix-секунды, UTC
  uint64 end = 2;   // Unix-секунды, UTC; end > start
}
