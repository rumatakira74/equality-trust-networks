// Чекпоинты, эпохи и пороговая подпись (KNOWLEDGE.md v9.2, разделы 9.1, 9.2, 12.5).
//
// Чекпоинт = подписанный пороговой подписью хеш корня состояния
// (sparse Merkle-дерево балансов и seq; 9.1). Даёт детерминированный порядок
// «до/после», безопасные снапшоты для лёгких узлов и время сети (9.2).
//
// Решение этапа 0 по схеме пороговой подписи: N-из-M НАБОР ПОДПИСЕЙ ECDSA P-256
// (не BLS). Обоснование и сравнение — spec/07.

syntax = "proto3";

package tnp.v1;

import "core.proto";

// ---------------------------------------------------------------------------
// Лист состояния кошелька в sparse Merkle-дереве.
// Дерево разреженное: индекс листа = адрес кошелька (32 байта); пустые индексы
// дают нулевой хеш по умолчанию. Документ требует «балансы и seq» (9.1);
// статус, метки и эпохи включены в лист, потому что предъявление attest (6.1)
// требует доказуемого из чекпоинта состояния кошелька (статус, метка flagged).
// Состав листа — решение спецификации (PENDING: вопрос №30).
// ---------------------------------------------------------------------------
message StateLeaf {
  uint64 seq = 1;                // последний seq кошелька (для проверки двойной траты)
  uint64 balance = 2;            // номинальный баланс; демередж применяется
                                 // детерминированно при следующей операции (10.3)
  WalletStatus status = 3;
  WalletFlags flags = 4;
  uint64 registered_epoch = 5;   // эпоха register (для возраста и истечения)
  uint64 activated_epoch = 6;   // 0, если не активирован
  uint64 last_claimed_period = 7; // последний заявленный период выпуска
                                 // (проверка двойного выпуска)
  uint64 delayed_threshold = 8;  // текущий личный порог P (8.3)
  uint64 threshold_change_epoch = 9; // эпоха вступления в силу незавершённого
                                    // повышения P (0 — нет незавершённого)
}

// ---------------------------------------------------------------------------
// Чекпоинт эпохи.
// checkpoint_hash = SHA-256(canonical(Checkpoint без threshold_sig)).
// Подписи в ThresholdSignature ставятся над checkpoint_hash.
// ---------------------------------------------------------------------------
message Checkpoint {
  bytes network_id = 1;
  uint64 epoch = 2;                 // номер эпохи; эпоха 0 — genesis-чекпоинт
                                    // с корнем посевного круга
  bytes state_root = 3;             // корень sparse Merkle-дерева состояния
  bytes prev_checkpoint_hash = 4;   // цепочка чекпоинтов; для эпохи 0 — 32 нулевых байта
  uint64 network_time = 5;          // сетевое время эпохи, Unix-секунды, UTC;
                                    // источник правды — эпохи, не медиана timestamps (9.2)
  uint32 protocol_version = 6;      // версия протокола (13)
  uint64 active_wallets = 7;       // число active-кошельков на эпоху:
                                    // для seed_sunset, адаптивной комиссии (10.2)
                                    // и параметра members_quorum
  uint64 total_supply = 8;         // контрольная сумма предложения для инварианта
                                    // сохранения (spec/04, INV-4)
  repeated bytes participants = 9; // состав подписантов M (адреса); правила
                                    // формирования — по checkpoint_mode (spec/07)
  uint64 threshold = 10;           // минимальное число N валидных подписей
  ThresholdSignature threshold_sig = 11;
  repeated bytes finalized_txid_list = 12; // [этап 5, spec/04 INV-1c] txid,
                                   // финализированные в эпохе: выбранные
                                   // ветки конфликтов (по одной на wallet+seq);
                                   // альтернативные ветки остаются в журнале
                                   // хранения — replay воспроизводит выбор
}

// N-из-M набор подписей ECDSA P-256 (решение этапа 0; см. spec/07).
// Валидность: ≥ threshold подписей, каждая подпись верна и подписант входит
// в participants.
message ThresholdSignature {
  repeated SignatureShare signatures = 1;
}

message SignatureShare {
  bytes signer = 1;    // адрес подписанта; обязан входить в participants
  bytes signature = 2; // DER ECDSA P-256 над checkpoint_hash
}

// ---------------------------------------------------------------------------
// Merkle-доказательство листа из чекпоинта (для лёгких узлов и attest, 6.1, 12.5).
// ---------------------------------------------------------------------------
message MerkleProof {
  bytes leaf = 1;            // canonical(StateLeaf)
  repeated bytes siblings = 2; // братские хеши от листа к корню (слева направо)
  bytes root = 3;            // ожидаемый корень (сверяется с Checkpoint.state_root)
}
