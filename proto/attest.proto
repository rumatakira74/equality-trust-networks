// Предъявление attest (KNOWLEDGE.md v9.2, раздел 6.1) — сообщение ВНЕ реестра.
// Не входит в закрытый перечень транзакций (9.3): подписывается кошельком
// и передаётся проверяющему напрямую вместе с Merkle-доказательством
// из чекпоинта и самим чекпоинтом.
//
// «Один человек — одно действие» в стороннем приложении:
// app_subject_id = SHA-256(address || app_id) — публично связан с адресом
// (тайные голосования в v1 не поддерживаются, 6.1).

syntax = "proto3";

package tnp.v1;

import "core.proto";
import "checkpoint.proto";

message Attestation {
  bytes network_id = 1;        // из какой сети приходит «человек» (6.1)
  bytes manifest_hash = 2;     // с какими гарантиями; сверяется с чекпоинтом
  bytes address = 3;
  WalletStatus status = 4;
  uint64 age_days = 5;         // возраст кошелька; проверяющий решает сам,
                               // протокол вердиктов не выносит (6.1)
  uint32 vouch_depth = 6;     // глубина графа поручительств; вычисляется
                              // из публичного реестра (вспомогательный слой, 7.4)
  bool flagged = 7;            // метка из доказуемого состояния
  uint64 checkpoint_epoch = 8; // эпоха чекпоинта, из которого доказательство
  bytes challenge = 9;         // challenge проверяющего; защита от повторного
                              // использования предъявления
  uint64 expires_at = 10;     // срок годности, Unix-секунды, UTC
  bytes signature = 11;       // подпись кошелька по signing_auth сети
                              // над SHA-256(canonical(Attestation без signature))
  MerkleProof proof = 12;    // доказательство StateLeaf из чекпоинта
  Checkpoint checkpoint = 13; // чекпоинт с пороговой подписью
}

// Вычисляемый идентификатор субъекта для стороннего приложения (6.1).
// Не передаётся, вычисляется проверяющим:
//   app_subject_id = SHA-256(address || app_id)
