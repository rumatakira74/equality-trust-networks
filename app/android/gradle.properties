# Лимиты локальных прогонов (правило владельца): JVM ≤ 6 ГБ, воркеры
# Gradle ≤ 6 ядер из 8; эмулятору — -memory, контроль free -m (стоп при
# < 2 ГБ свободной). CI использует те же значения.
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=3G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=6
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
