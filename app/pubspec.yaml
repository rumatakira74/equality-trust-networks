name: tnp_app
description: >-
  Приложение платформы сетей доверия (Equality Project, этап 7):
  Flutter — интерфейс, Kotlin — платформенный слой (Keystore,
  биометрия, Bluetooth), Go — ядро (AAR через gomobile bind).
publish_to: 'none'

version: 0.7.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # управление состоянием: ChangeNotifier + Provider (обоснование —
  # отчёт этапа 7: минимум зависимостей, без кодогенерации, мокается
  # в тестах)
  provider: ^6.1.2
  # QR-код адреса для поручительства при личной встрече (7.4)
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
