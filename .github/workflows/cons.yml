# CI консенсуса (этап 5): go test / go vet / gofmt по каждому push и PR.
# Включает детерминированную симуляцию (sim/) и сетевые тесты консенсуса.
name: cons
on:
  push:
    paths: ["cons/**", "sim/**", "net/**", "core/**", "cmd/**", "go.mod", "go.sum", ".github/workflows/cons.yml"]
  pull_request:
    paths: ["cons/**", "sim/**", "net/**", "core/**", "cmd/**", "go.mod", "go.sum", ".github/workflows/cons.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
      - name: gofmt
        run: test -z "$(gofmt -l cons/ sim/)"
      - name: go vet
        run: go vet ./cons/... ./sim/...
      - name: go test (cons + sim)
        run: go test -race ./cons/... ./sim/... -timeout 900s
