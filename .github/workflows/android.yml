# CI Android-платформы (этап 6): сборка AAR ядра (gomobile bind),
# сборка APK, unit-тесты приложения и моста (go test ./mobile/).
# Instrumented-тесты (Keystore, биометрия, BT) — на устройстве/эмуляторе
# локально (чек-лист отчёта этапа 6); в CI — только JVM-уровень.
name: android
on:
  push:
    paths: ["mobile/**", "android/**", "core/**", "net/**", "cons/**", "go.mod", "go.sum", ".github/workflows/android.yml"]
  pull_request:
    paths: ["mobile/**", "android/**", "core/**", "net/**", "cons/**", "go.mod", "go.sum", ".github/workflows/android.yml"]
jobs:
  aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK (NDK для gomobile)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.1.0" > /dev/null
      - name: gomobile tools
        run: go install golang.org/x/mobile/cmd/gomobile@latest && go install golang.org/x/mobile/cmd/gobind@latest
      - name: gomobile bind (AAR)
        run: |
          gomobile bind -target=android -androidapi 26 -o android/libs/tnp.aar ./mobile
          ls -la android/libs/tnp.aar
      - uses: actions/upload-artifact@v4
        with:
          name: tnp-aar
          path: android/libs/tnp.aar
  apk:
    runs-on: ubuntu-latest
    needs: aar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: tnp-aar
          path: android/libs/
      - name: Gradle wrapper
        run: android/gradlew --version
        working-directory: android/
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
      - name: Unit-тесты приложения (JVM)
        run: android/gradlew :app:testDebugUnitTest --no-daemon
        working-directory: android/
      - name: Сборка APK (debug + release)
        run: android/gradlew :app:assembleDebug :app:assembleRelease --no-daemon
        working-directory: android/
      - name: Размер APK (12.1)
        run: |
          ls -la android/app/build/outputs/apk/debug/ android/app/build/outputs/apk/release/
      - uses: actions/upload-artifact@v4
        with:
          name: tnp-apk
          path: android/app/build/outputs/apk/**/**.apk
  mobile-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: gofmt
        run: test -z "$(gofmt -l mobile/)"
      - name: go vet
        run: go vet ./mobile/...
      - name: go test (мост)
        run: go test ./mobile/... -timeout 300s
