# CI Flutter-приложения (этап 7): analyze + unit/widget-тесты +
# сборка APK. AAR ядра собирается gomobile bind (как android.yml).
# Instrumented/эмуляторные проверки — локально (эмулятор-first,
# отчёт этапа 7); в CI — JVM-уровень Dart.
name: flutter
on:
  push:
    paths: ["app/**", "mobile/**", "core/**", "net/**", "cons/**", "go.mod", "go.sum", ".github/workflows/flutter.yml"]
  pull_request:
    paths: ["app/**", "mobile/**", "core/**", "net/**", "cons/**", "go.mod", "go.sum", ".github/workflows/flutter.yml"]
jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@9a48871cbeff8679f6337339dc79b806ad9a9a13 # v2.9.1
        with:
          channel: stable
          flutter-version: "3.47.9"
      - name: flutter pub get
        run: flutter pub get
        working-directory: app/
      - name: flutter analyze
        run: flutter analyze
        working-directory: app/
      - name: flutter test
        run: flutter test
        working-directory: app/
  apk:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@9a48871cbeff8679f6337339dc79b806ad9a9a13 # v2.9.1
        with:
          channel: stable
          flutter-version: "3.47.9"
      - name: Android SDK (NDK для gomobile)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.1.0" > /dev/null
      - name: gomobile tools
        run: go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867 && go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261011034528-197770444867
      - name: gomobile bind (AAR ядра)
        run: |
          gomobile bind -target=android -androidapi 26 -ldflags "-checklinkname=0" -o android/libs/tnp.aar ./mobile
          ls -la android/libs/tnp.aar
      - name: Сборка APK (debug)
        run: flutter build apk --debug
        working-directory: app/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tnp-app-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
